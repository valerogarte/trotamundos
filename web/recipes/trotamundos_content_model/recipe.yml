name: 'Modelo de contenidos de Trotamundos'
description: 'Crea Destino, Establecimiento, Guía de viaje y Página básica con sus campos y relaciones.'
type: 'Content model'
install:
  - node
  - path
  - text
  - image
  - link
config:
  strict:
    - field.storage.node.body
    - field.storage.node.field_address
    - field.storage.node.field_departamento
    - field.storage.node.field_destination
    - field.storage.node.field_destinations
    - field.storage.node.field_establishment_type
    - field.storage.node.field_image
    - field.storage.node.field_municipio
    - field.storage.node.field_website
  import:
    node:
      - core.entity_view_mode.node.full
      - core.entity_view_mode.node.rss
      - core.entity_view_mode.node.teaser
      - system.action.node_delete_action
      - system.action.node_make_sticky_action
      - system.action.node_make_unsticky_action
      - system.action.node_promote_action
      - system.action.node_publish_action
      - system.action.node_save_action
      - system.action.node_unpromote_action
      - system.action.node_unpublish_action
    image:
      - image.style.medium
