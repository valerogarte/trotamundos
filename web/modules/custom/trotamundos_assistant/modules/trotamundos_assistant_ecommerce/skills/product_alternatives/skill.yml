machine_name: product_alternatives
title: 'Mostrar alternativas'
btn_responsive_title: 'Ver alternativas'
group: ecommerce
theme:
  variables:
    intro: ''
    outro: ''
    product_items: []
handler:
  class: 'Drupal\trotamundos_assistant_ecommerce\SkillLocal\ProductAlternatives\ProductAlternativesSkillHandler'
  file: 'src/ProductAlternativesSkillHandler.php'
assets:
  dependencies:
    - trotamundos_assistant_ecommerce/skill.product_common
